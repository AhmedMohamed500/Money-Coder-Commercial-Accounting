services:
  postgres:
    image: postgres:16-alpine
    container_name: money-coder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: moneycoder
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: moneycoder
    ports:
      - "54329:5432"
    volumes:
      - money_coder_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneycoder -d moneycoder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  money_coder_pgdata:
